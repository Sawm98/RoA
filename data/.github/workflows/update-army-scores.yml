
name: Update Army Scores

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Budapest"

  # Allows you to run it manually too
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-army-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run army score scraper
        run: python update_army_scores.py

      - name: Save updated CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_army_scores.csv
          git diff --cached --quiet || git commit -m "Update latest army scores"
          git push
